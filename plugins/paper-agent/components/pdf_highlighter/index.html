<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent}
  #wrap{position:relative;user-select:none;cursor:crosshair;touch-action:none}
  #img{width:100%;display:block;pointer-events:none}
  #sel{position:absolute;border:2px solid #d4a017;background:rgba(255,213,0,.22);display:none;pointer-events:none}
</style></head>
<body>
<div id="wrap"><img id="img" alt="PDF 쪽"><div id="sel"></div></div>
<script>
// Streamlit 컴포넌트 프로토콜 (외부 라이브러리 없이 postMessage 로 직접)
const send = (type, data) => window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, data), "*");
const wrap = document.getElementById("wrap"), img = document.getElementById("img"), sel = document.getElementById("sel");
const fit = () => send("streamlit:setFrameHeight", {height: Math.ceil(wrap.getBoundingClientRect().height)});
img.onload = fit;
window.addEventListener("resize", fit);
window.addEventListener("message", e => {
  if (e.data && e.data.type === "streamlit:render") {
    const src = e.data.args.img;
    if (img.getAttribute("src") !== src) { img.setAttribute("src", src); sel.style.display = "none"; }
    fit();
  }
});
let start = null;
const pos = ev => { const r = wrap.getBoundingClientRect(); return [Math.min(Math.max(ev.clientX - r.left, 0), r.width), Math.min(Math.max(ev.clientY - r.top, 0), r.height)]; };
wrap.addEventListener("pointerdown", ev => { start = pos(ev); wrap.setPointerCapture(ev.pointerId); sel.style.display = "none"; });
wrap.addEventListener("pointermove", ev => {
  if (!start) return;
  const [x, y] = pos(ev);
  Object.assign(sel.style, {display: "block", left: Math.min(x, start[0]) + "px", top: Math.min(y, start[1]) + "px",
    width: Math.abs(x - start[0]) + "px", height: Math.abs(y - start[1]) + "px"});
});
wrap.addEventListener("pointerup", ev => {
  if (!start) return;
  const [x, y] = pos(ev), r = wrap.getBoundingClientRect();
  const box = [Math.min(x, start[0]), Math.min(y, start[1]), Math.max(x, start[0]), Math.max(y, start[1])];
  start = null;
  if (box[2] - box[0] < 6 || box[3] - box[1] < 4) { sel.style.display = "none"; return; }  // 클릭은 무시
  send("streamlit:setComponentValue", {dataType: "json",
    value: {x0: box[0] / r.width, y0: box[1] / r.height, x1: box[2] / r.width, y1: box[3] / r.height, nonce: Date.now()}});
});
send("streamlit:componentReady", {apiVersion: 1});
</script>
</body></html>
